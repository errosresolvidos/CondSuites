workflows:
  kmp-ios-test:
    name: iOS IPA Build (Local / Testes)
    max_build_duration: 120
    instance_type: mac_mini_m1 # Instância macOS recomendada

    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace" # Caminho para o .xcworkspace do projeto iOS
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"     # Caminho para o .xcodeproj do projeto iOS
        XCODE_SCHEME: "iosApp"                       # Nome do Scheme no Xcode
      java: 17                                       # Versão do Java necessária para o Gradle/KMP
      xcode: latest                                  # Versão do Xcode
      cocoapods: default                             # Instala a versão padrão do CocoaPods se utilizado

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Set up Java & Gradle permissions
        script: |
          chmod +x gradlew

      - name: Build KMP Shared Module
        script: |
          # Compila o módulo compartilhado Kotlin para todas as plataformas
          ./gradlew :shared:assemble

      - name: Install iOS Dependencies (CocoaPods)
        script: |
          # Instala CocoaPods se houver um Podfile
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp
            pod install
            cd ..
          fi

      - name: Build iOS IPA for Testing
        script: |
          mkdir -p build/ios/ipa
          
          BUILD_TARGET_FLAG=""
          if [ -d "$XCODE_WORKSPACE" ]; then
            echo "Usando Workspace: $XCODE_WORKSPACE"
            BUILD_TARGET_FLAG="-workspace $XCODE_WORKSPACE"
          elif [ -d "$XCODE_PROJECT" ] || [ -f "$XCODE_PROJECT" ]; then
            echo "Usando Projeto: $XCODE_PROJECT"
            BUILD_TARGET_FLAG="-project $XCODE_PROJECT"
          else
            echo "---------------------------------------------------------"
            echo "ERRO: Projeto Xcode não encontrado no repositório!"
            echo "Procurado em: '$XCODE_WORKSPACE' e '$XCODE_PROJECT'"
            echo "Certifique-se de commitar a pasta 'iosApp' com o projeto iOS."
            echo "---------------------------------------------------------"
            exit 1
          fi

          # Compila e arquiva o projeto iOS via xcodebuild sem exigir certificados pagos
          xcodebuild archive \
            $BUILD_TARGET_FLAG \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -archivePath build/ios/iosApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          # Empacota o app compilado na estrutura de pacote IPA (.ipa)
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iosApp.xcarchive/Products/Applications/iosApp.app build/ios/ipa/Payload/
          
          cd build/ios/ipa
          zip -q -r iosApp.ipa Payload
          cd ../../..
          
          echo "IPA de teste gerado com sucesso em: build/ios/ipa/iosApp.ipa"

    artifacts:
      # Caminhos dos arquivos .ipa gerados para download no Codemagic
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - dev@suaempresa.com
